function streamReply(raw){
  const m = /"reply"\s*:\s*"/.exec(raw); if(!m) return null;
  let out = "", i = m.index + m[0].length;
  while(i < raw.length){
    const c = raw[i];
    if(c === "\\"){ const n = raw[i+1]; if(n === undefined) break;
      if(n === "n") out += "\n"; else if(n === "t") out += "\t"; else if(n === "r"){}
      else if(n === "u"){ const h = raw.slice(i+2,i+6); if(h.length < 4) break; out += String.fromCharCode(parseInt(h,16)); i += 6; continue; }
      else out += n; i += 2; continue; }
    if(c === '"') break; out += c; i++;
  }
  return out;
}
function apply(env){
  if(!env || typeof env !== "object") return;
  if(env.profile && typeof env.profile === "object") Object.keys(env.profile).forEach(k => {
    const v = env.profile[k]; if(typeof v === "string" && v.trim() && FIELDS.some(f => f.key === k)) S.profile[k] = v.trim();

  if(typeof env.stage === "string") S.stage = env.stage;
  if(env.regulated && typeof env.regulated === "object" && (env.regulated.triggered || !S.regulated.triggered)) S.regulated = env.regulated;
  if(!user && env.gate) S.gated = true;
}

const VERDICTS = ["strong","moderate","weak"];
function normaliseAssessment(env){
  const out = {route:(env && env.route) || "Innovator Founder", overall:String((env && env.overall) || "").replace(/^[^.]*preliminary fit:[^.]*\.\s*/i, ""), areas:[], ivs:{}, at:new Date().toISOString()};

    const src = list.find(x => x && x.key === a.key) || {};
    const v = VERDICTS.includes(src.verdict) ? src.verdict : "moderate";
    out.areas.push({key:a.key, verdict:v, summary:String(src.summary || "").trim() || "Assessed from your answer.", assessed:String(src.assessed || "").trim(),
      evidence:Array.isArray(src.evidence) ? src.evidence.map(String).slice(0,5) : [], gaps:Array.isArray(src.gaps) ? src.gaps.map(String).slice(0,5) : [], move:String(src.move || "").trim(), answer:S.intake[a.key] || ""});
  });
  const rank = {strong:3, moderate:2, weak:1};
  ["innovation","viability","scalability"].forEach(k => {
    const given = env && env.ivs && env.ivs[k];
    if(given && VERDICTS.includes(given.verdict)) out.ivs[k] = {verdict:given.verdict, note:String(given.note || "")};
    else { const avg = IVS_MAP[k].reduce((s,ak) => s + rank[out.areas.find(x => x.key === ak).verdict], 0) / IVS_MAP[k].length; out.ivs[k] = {verdict: avg >= 2.6 ? "strong" : avg >= 1.9 ? "moderate" : "weak", note:"Derived from " + IVS_MAP[k].map(ak => AREA[ak].label.toLowerCase()).join(", ") + "."}; }
  });
  if(!out.overall) out.overall = "Assessed from your nine answers. Further assessment recommended.";
  return out;
}

const pdfText = s => String(s || "").replace(/→/g,"-").replace(/✓/g,"").replace(/[‘’]/g,"'").replace(/[“”]/g,'"');
function pdfDoc(title, subtitle){
  const {jsPDF} = window.jspdf; const doc = new jsPDF({unit:"mm", format:"a4"});
  const W = 210, M = 18, maxW = W - 2*M; let y = 0, page = 1;
  const header = () => { doc.setFillColor(14,30,58); doc.rect(0,0,W,26,"F"); doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.text("ISKRA SERVICES", M, 11); doc.setFont("helvetica","normal"); doc.setFontSize(13); doc.text(pdfText(title), M, 19); doc.setFontSize(8); doc.setTextColor(233,185,73); doc.text(pdfText(subtitle), W-M, 19, {align:"right"}); doc.setTextColor(18,18,18); y = 36; };
  const footer = () => { doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(120,120,120); doc.text("Iskra Readiness Assessment - preparatory, not a Home Office score and not a guarantee of endorsement. Iskra is not an authorised endorsing body. Concept prototype.", M, 289, {maxWidth:maxW-14}); doc.text(String(page), W-M, 289, {align:"right"}); };
  const need = h => { if(y + h > 280){ footer(); doc.addPage(); page++; header(); } };
  const heading = (t, size=13) => { need(14); doc.setFont("helvetica","bold"); doc.setFontSize(size); doc.setTextColor(18,18,18); doc.text(pdfText(t), M, y); y += size*0.5 + 3; };
  const label = t => { need(8); doc.setFont("helvetica","bold"); doc.setFontSize(7.5); doc.setTextColor(107,111,118); doc.text(pdfText(t).toUpperCase(), M, y); y += 4.5; };
  const para = (t, size=10, color=[18,18,18]) => { doc.setFont("helvetica","normal"); doc.setFontSize(size); doc.setTextColor(color[0],color[1],color[2]); const lines = doc.splitTextToSize(pdfText(t), maxW); const lh = size*0.42; for(const ln of lines){ need(lh+1); doc.text(ln, M, y); y += lh; } y += 2.5; };
  const bullets = arr => { doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(18,18,18); for(const it of arr || []){ const lines = doc.splitTextToSize(pdfText(it), maxW-6); for(let i=0;i<lines.length;i++){ need(5.2); doc.text(i===0 ? "•" : " ", M, y); doc.text(lines[i], M+5, y); y += 4.4; } } y += 2; };
  const rule = () => { need(6); doc.setDrawColor(224,226,230); doc.line(M, y, W-M, y); y += 5; };
  header();
  return {doc, heading, label, para, bullets, rule, gap:(h=4) => { y += h; }, finish:() => { footer(); return doc; }};
}
function pdfAssessment(){

  P.heading(A.route + ": preparatory readiness " + readinessScore() + " / 100", 15); P.para(A.overall, 10.5, [80,84,90]);

async function savePdf(doc, filename){

    catch(err){ if(err && err.code === "cancelled") return; if(!err || err.code !== "unavailable"){ toast("Couldn't save. Try again"); return; } }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();

async function shareDoc(doc, filename, summary){
  try{
    const file = new File([doc.output("blob")], filename, {type:"application/pdf"});

    const sd = $("#sim-decide"); if(sd) sd.addEventListener("click", () => { S.external.status = "approved"; save(); renderApp(); toast("Endorsement approved by the endorsing body"); });
  }
}

/* ============================================================

let authMode = "login";
const AUTH = {
  login: {title:"Welcome back", sub:"Log in to pick up your case where you left it.", submit:"Log in", name:false, pw:true, google:true, row:true, legal:false, sw:'New to Iskra? <button type="button" class="auth-link" data-auth="signup">Create a free account</button>'},
  signup:{title:"Create your free account", sub:"Your Founder Assessment, profile and journey, saved and reused at every stage.", submit:"Create account", name:true, pw:true, google:true, row:false, legal:true, sw:'Already have an account? <button type="button" class="auth-link" data-auth="login">Log in</button>'},
  google:{title:"Continue with Google", sub:"Enter the email on your Google account.", submit:"Continue", name:false, pw:false, google:false, row:false, legal:false, sw:'<button type="button" class="auth-link" data-auth="login">Back to log in</button>'},
  forgot:{title:"Reset your password", sub:"We'll email you a link to set a new one.", submit:"Send reset link", name:false, pw:false, google:false, row:false, legal:false, sw:'<button type="button" class="auth-link" data-auth="login">Back to log in</button>'}
};
function setAuth(m){
  authMode = AUTH[m] ? m : "login"; const c = AUTH[authMode];
  $("#auth-main").hidden = false; $("#auth-done").hidden = true;
  $("#auth-title").textContent = c.title; $("#auth-sub").textContent = c.sub;
  $("#auth-google").hidden = !c.google; $("#auth-or").hidden = !c.google;
  $("#f-name").hidden = !c.name; $("#f-pw").hidden = !c.pw; $("#auth-row").hidden = !c.row; $("#auth-legal").hidden = !c.legal;
  $("#auth-form").password.autocomplete = authMode === "signup" ? "new-password" : "current-password";
  $("#auth-submit").textContent = c.submit; $("#auth-switch").innerHTML = c.sw; authError("");
  setTimeout(() => { const f = $$("#auth-form input").find(i => !i.closest(".field").hidden); if(f) f.focus(); }, 30);
}
function authError(msg, field){ const e = $("#auth-err"); e.textContent = msg; e.hidden = !msg; $$("#auth-form input").forEach(i => i.removeAttribute("aria-invalid")); if(field) field.setAttribute("aria-invalid","true"); }
function openAuth(m){ setAuth(m); $("#auth").hidden = false; $("#acct-menu").hidden = true; }
function closeAuth(){ $("#auth").hidden = true; $("#auth-form").reset(); }
function showDone(title, sub, btn, onBtn){ $("#auth-main").hidden = true; $("#auth-done").hidden = false; $("#done-title").textContent = title; $("#done-sub").textContent = sub; const b = $("#done-btn"); b.textContent = btn; b.onclick = onBtn; setTimeout(() => b.focus(), 30); }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600); }
function renderAccount(){
  const on = !!user, nl = $("#nav-login");
  if(on){ nl.textContent = "My dashboard"; nl.removeAttribute("data-auth-open"); nl.onclick = () => setView("app"); $("#acct-initial").textContent = (user.name || user.email || "?").trim()[0].toUpperCase(); $("#acct-name").textContent = user.name; $("#acct-email").textContent = user.email; }
  else { nl.textContent = "Log in"; nl.setAttribute("data-auth-open","login"); nl.onclick = null; }
  $("#acct-menu").hidden = true; $("#acct-btn").setAttribute("aria-expanded","false");
}
function signIn(u, remember){
  user = u; S.gated = false; scriptStep = 0;
  try{ localStorage.removeItem(SESSION); sessionStorage.removeItem(SESSION); (remember ? localStorage : sessionStorage).setItem(SESSION, JSON.stringify(u)); }catch(e){}
  if(u.name && (!S.profile.name || S.nameAuto)){ S.profile.name = u.name; S.nameAuto = true; }
  save(); renderAccount(); renderThread(); renderChips();
}

  user = null; try{ localStorage.removeItem(SESSION); sessionStorage.removeItem(SESSION); }catch(e){}

/* first login → the nine questions, before the dashboard */
function enterApp(){
  setView("app");
  if(!S.intakeSeen && !S.assessment){ showModule("assess", {firstRun:true}); }
}
function wireAuth(){
  document.addEventListener("click", e => {
    const oc = e.target.closest("[data-open-chat]"); if(oc){ openChat(oc.dataset.prefill || ""); return; }
    const o = e.target.closest("[data-auth-open]"); if(o){ openAuth(o.dataset.authOpen); return; }
    const a = e.target.closest("[data-auth]"); if(a && a.closest("#auth")){ setAuth(a.dataset.auth); return; }
    const u = e.target.closest("[data-unlock]"); if(u){ openCheckout(u.dataset.unlock); return; }
    const rq = e.target.closest("[data-request]"); if(rq){ openRequest(rq.dataset.request, rq.dataset.spec || ""); return; }
    const ra = e.target.closest("[data-run-assess]"); if(ra){ showModule("assess"); if(intakeDone() >= 9) runAssessment(); return; }
    const g = e.target.closest("[data-go]"); if(g){ setView("app"); showModule(g.dataset.go); return; }
    const ms = e.target.closest("[data-ms]"); if(ms){ if(ms.dataset.msUnlock) openCheckout(ms.dataset.msUnlock); else showModule(ms.dataset.ms); return; }
    const ml = e.target.closest("[data-module-link]"); if(ml){ e.preventDefault(); showModule(ml.dataset.moduleLink); return; }
    const m = e.target.closest("[data-menu]"); if(m){ $("#acct-menu").hidden = true; if(m.dataset.menu === "logout") signOut(); else if(m.dataset.menu === "plan"){ setView("app"); showModule("myplan"); } else setView("site"); return; }
    if(!e.target.closest("#account")){ $("#acct-menu").hidden = true; $("#acct-btn").setAttribute("aria-expanded","false"); }
  });
  $("#acct-btn").addEventListener("click", e => { e.stopPropagation(); const mm = $("#acct-menu"); mm.hidden = !mm.hidden; $("#acct-btn").setAttribute("aria-expanded", String(!mm.hidden)); });
  $("#auth-x").addEventListener("click", closeAuth); $("#auth").addEventListener("click", e => { if(e.target === $("#auth")) closeAuth(); });
  $("#pw-toggle").addEventListener("click", () => { const i = $("#auth-form").password; i.type = i.type === "password" ? "text" : "password"; $("#pw-toggle").textContent = i.type === "password" ? "Show" : "Hide"; });
  $("#auth-form").addEventListener("submit", async e => {
    e.preventDefault();
    const f = $("#auth-form"), c = AUTH[authMode];
    const name = f.name.value.trim(), email = f.email.value.trim(), pw = f.password.value, remember = !!f.remember.checked;
    if(c.name && !name) return authError("Tell us your name.", f.name);
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return authError("That email doesn't look right.", f.email);
    if(c.pw && pw.length < 8) return authError("Your password needs at least 8 characters.", f.password);
    authError(""); const btn = $("#auth-submit"); btn.classList.add("busy"); await new Promise(r => setTimeout(r, 900)); btn.classList.remove("busy");
    if(authMode === "forgot"){ showDone("Check your inbox", "We've sent a reset link to " + email + ". It expires in 30 minutes.", "Back to log in", () => setAuth("login")); return; }
    const display = name || email.split("@")[0].replace(/[._-]+/g," ").replace(/\b\w/g, ch => ch.toUpperCase());
    signIn({name:display, email}, authMode === "login" ? remember : true); f.reset();
    const pu = pendingUnlock; pendingUnlock = null;
    const firstRun = !S.intakeSeen && !S.assessment;
    showDone(authMode === "signup" ? "Account created" : "You're in", "Signed in as " + email + ". Your conversation and profile carried over.", pu ? "Continue to unlock" : firstRun ? "Start my free assessment" : "Open my dashboard",
      () => { closeAuth(); enterApp(); if(pu) openCheckout(pu); });
  });
}

  if(everything){ try{ localStorage.removeItem(SESSION); sessionStorage.removeItem(SESSION); sessionStorage.removeItem("iskra-nudge"); }catch(e){} }

  let q = ""; try{ q = (location.search || "") + (location.hash || ""); }catch(e){}
  if(!/(^|[?&#])(demo|reset)\b/i.test(q)) return;
  clearStored(true); user = null; try{ history.replaceState(null, "", location.pathname); }catch(e){}

function clearComposer(){ const b = $("#input"); if(b){ b.value = ""; b.style.height = "auto"; } setPrefill(""); autosize(); }
function resetConversation(){
  const keep = {plan:S.plan, module:S.module, intake:S.intake, intakeSeen:S.intakeSeen, intakeTouched:S.intakeTouched}; S = Object.assign(blank(), keep); scriptStep = 0; clearStored(false); save(); clearComposer();

  clearStored(true); user = null; S = blank(); scriptStep = 0; working = null; save(); clearComposer();
  renderAccount(); setView("site"); renderThread(); renderChips(); closeChat(); closeAuth(); closeCheckout(); closeRequest(); $("#nudge").hidden = true; toast("Demo reset. Clean slate");

function armConfirm(btn, label, go){
  if(!btn) return; const idle = btn.innerHTML; let armed = false, t = null;
  const stand = () => { armed = false; btn.classList.remove("confirm"); btn.innerHTML = idle; };
  btn.addEventListener("click", e => { e.stopPropagation(); if(armed){ clearTimeout(t); stand(); go(); return; } armed = true; btn.classList.add("confirm"); btn.textContent = label; t = setTimeout(stand, 3000); });
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  demoResetCheck(); S = load();
  renderAccount(); wireAuth(); wireCheckout(); wireRequest(); renderThread(); renderChips();
  $("#launcher").addEventListener("click", () => openChat(""));
  $("#w-close").addEventListener("click", closeChat);
  armConfirm($("#w-reset"), "Reset?", resetConversation);
  armConfirm($("#foot-reset"), "Reset everything?", resetEverything);
  $("#send").addEventListener("click", send);
  $("#stop").addEventListener("click", () => { if(ctl) ctl.abort(); });
  const box = $("#input");
  box.addEventListener("input", () => { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 140) + "px"; });
  box.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
  $$(".rail-item").forEach(b => b.addEventListener("click", () => showModule(b.dataset.module)));
  document.addEventListener("keydown", e => {
    if(e.key !== "Escape") return;
    if(!$("#auth").hidden) closeAuth(); else if(!$("#checkout").hidden) closeCheckout(); else if(!$("#req").hidden) closeRequest();
    else if(!$("#acct-menu").hidden) $("#acct-menu").hidden = true; else if(!$("#widget").hidden) closeChat();
  });
  let dismissed = false; try{ dismissed = sessionStorage.getItem("iskra-nudge") === "1"; }catch(e){}
  if(!dismissed && !S.turns.length && !user) setTimeout(() => { if($("#widget").hidden && $("#app").hidden){ $("#nudge").hidden = false; setTimeout(() => { $("#nudge").hidden = true; }, 15000); } }, 6000);
  $("#nudge-x").addEventListener("click", () => { $("#nudge").hidden = true; try{ sessionStorage.setItem("iskra-nudge","1"); }catch(e){} });
  $("#nudge").addEventListener("click", e => { if(e.target.id !== "nudge-x") openChat(""); });
  /* Route carousel. Smooth programmatic scrolling is unreliable on a scroll-snap container,
     so the arrows animate scrollLeft themselves with snapping paused for the duration. */
  $("#input").addEventListener("input", autosize);
  const r = $("#routes-track"), stepW = () => (r.querySelector(".route")?.offsetWidth || 360) + 18;
  const arrows = () => { const max = r.scrollWidth - r.clientWidth - 2; $("#prev").disabled = r.scrollLeft <= 2; $("#next").disabled = r.scrollLeft >= max; };
  const slide = dir => {
    const step = stepW(), max = r.scrollWidth - r.clientWidth, from = r.scrollLeft;
    const target = Math.max(0, Math.min(max, (Math.round(from / step) + dir) * step));
    if(Math.abs(target - from) < 1) return;
    r.style.scrollSnapType = "none";
    const t0 = performance.now(), D = 380, ease = x => 1 - Math.pow(1 - x, 3);
    const frame = now => { const p = Math.min(1, (now - t0) / D); r.scrollLeft = from + (target - from) * ease(p); if(p < 1) requestAnimationFrame(frame); else { r.scrollLeft = target; r.style.scrollSnapType = ""; arrows(); } };
    requestAnimationFrame(frame);
  };
  $("#prev").addEventListener("click", () => slide(-1));
  $("#next").addEventListener("click", () => slide(1));
  r.addEventListener("scroll", arrows, {passive:true}); window.addEventListener("resize", arrows); setTimeout(arrows, 50);
  window.addEventListener("hashchange", onHash); onHash();
  if(user) enterApp();
  capabilities();
}
async function capabilities(){
  if(!window.claude || typeof window.claude.use !== "function"){ setMode("script"); return; }
  try{ const s = await window.claude.use("sample"); if(s){ sampleFn = s; setMode("live"); } else setMode("script"); }catch(e){ setMode("script"); }
  try{ const d = await window.claude.use("downloads"); if(d) downloadsFn = d; }catch(e){}
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
