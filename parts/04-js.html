/* pull the reply string out of a partially-streamed JSON object */
function streamReply(raw){
  const m = /"reply"\s*:\s*"/.exec(raw); if(!m) return null;
  let out = "", i = m.index + m[0].length;
  while(i < raw.length){
    const c = raw[i];
    if(c === "\\"){ const n = raw[i+1]; if(n === undefined) break;
      if(n === "n") out += "\n"; else if(n === "t") out += "\t"; else if(n === "r"){}
      else if(n === "u"){ const h = raw.slice(i+2,i+6); if(h.length < 4) break; out += String.fromCharCode(parseInt(h,16)); i += 6; continue; }
      else out += n; i += 2; continue; }
    if(c === '"') break; out += c; i++;
  }
  return out;
}
function apply(env){
  if(!env || typeof env !== "object") return;
  if(env.profile && typeof env.profile === "object") Object.keys(env.profile).forEach(k => {
    const v = env.profile[k]; if(typeof v === "string" && v.trim() && FIELDS.some(f => f.key === k)) S.profile[k] = v.trim();
  });
  if(typeof env.stage === "string" && STAGES.includes(env.stage)) S.stage = env.stage;
  if(env.regulated && typeof env.regulated === "object" && (env.regulated.triggered || !S.regulated.triggered)) S.regulated = env.regulated;
  if(!user){ if(env.gate) S.gated = true; return; }   /* visitors never get scored */
  if(Array.isArray(env.pathways) && env.pathways.length) S.pathways = env.pathways;
  if(env.ivs && typeof env.ivs === "object" && env.ivs.innovation) S.ivs = env.ivs;
  if(env.assessment && typeof env.assessment === "object") S.assessment = env.assessment;
  if(Array.isArray(env.actions) && env.actions.length) S.actions = env.actions;

}

  const m = /£\s?([\d,]+)\s?(k|m)?/i.exec(text); if(m) got.funding = "£" + m[1] + (m[2] || "");
  if(/prototype|mvp|beta/.test(t)) got.stage = "Working prototype"; else if(/revenue|paying|customers|trading/.test(t)) got.stage = "Trading with customers"; else if(/idea|concept/.test(t)) got.stage = "Idea stage";
  const y = /(\d{1,2})\s*\+?\s*years?/i.exec(text); if(y) got.experience = y[1] + " years in the field";
  const loc = /(?:based|living|located|live|am)\s+in\s+([A-Z][A-Za-z\-]+(?:\s[A-Z][A-Za-z\-]+)?)/.exec(text); if(loc) got.location = loc[1];
  const v = /(?:start|build|launch|run|found|set up|setting up|starting|building)(?:ing)?\s+(?:a|an|my|our)\s+([a-z0-9][a-z0-9 \-&\/]{2,40}?)\s+(?:company|business|startup|start-up|firm|venture)/i.exec(text);
  if(v) got.venture = v[1].trim().replace(/^(new|own)\s+/i,"") + " company";
  return got;
}

const ERR = {rate_limited:"Too many requests just now — wait a minute and send it again.",session_expired:"Your session expired. Sign in again, then resend.",refused:"That one was declined. Try asking a different way.",empty_completion:"No answer came back. Ask for a bit less in one go.",invalid_json:"The answer came back malformed. Send it again.",upstream_error:"The connection dropped. Send it again when you're ready.",prompt_too_large:"This conversation is too long to send. Start over to continue.",invalid_request:"That couldn't be sent as written."};
const FATAL = new Set(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"]);
const userTurns = () => S.turns.filter(t => t.role === "user").length;

async function send(){
  if(busy) return;
  if(!user && S.gated){ clearComposer(); renderTier(); return; }
  const box = $("#input"), text = box.value.trim(); if(!text) return;
  box.value = ""; box.style.height = "auto";
  S.turns.push({role:"user",content:text});
  const t = $("#thread"); t.appendChild(bubble("user", text));
  const ai = bubble("ai",""); ai.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'; t.appendChild(ai);
  scrollThread(); setBusy(true);

  const finish = env => {
    const reply = (env && typeof env.reply === "string" && env.reply.trim()) ? env.reply.trim() : "I didn't manage to put that into words — ask me again, or narrow it down.";
    ai.textContent = reply; S.turns.push({role:"assistant",content:reply}); apply(env);
    if(!user && !S.gated && userTurns() >= 6) S.gated = true;
    save(); renderChips(env && env.suggestions);
    if(!user && S.gated){ t.appendChild(gateBubble()); }
    renderTier(); if(user) renderApp(); scrollThread();
  };

  if(mode !== "live"){ await new Promise(r => setTimeout(r, 600)); finish(runScript(text)); setBusy(false); return; }

  ctl = new AbortController(); let streamed = false;
  try{
    const input = [{role:"user",content:GROUNDING + "\n" + context()}].concat(S.turns.slice(-14).map(x => ({role:x.role,content:x.content})));
    const env = await sampleFn.json(input, {cache:false, signal:ctl.signal, onText:({text:raw}) => { const r = streamReply(raw); if(r){ streamed = true; ai.textContent = r; scrollThread(); } }});
    finish(env);
  }catch(err){
    const code = (err && err.code) || "upstream_error";
    if(code === "cancelled"){ if(streamed){ S.turns.push({role:"assistant",content:ai.textContent}); save(); } else ai.remove(); }
    else if(FATAL.has(code)){
      ai.remove(); setMode("script");
      t.appendChild(bubble("sys","Claude isn't available in this view, so the advisor has switched to a scripted walkthrough. Replies from here are pre-written."));
      const env = runScript(text); t.appendChild(bubble("ai", env.reply));
      S.turns.push({role:"assistant",content:env.reply}); apply(env); save(); renderChips(env.suggestions); if(user) renderApp();
    } else {
      if(err && err.text && err.text.trim()){ const partial = streamReply(err.text) || err.text; ai.textContent = partial; S.turns.push({role:"assistant",content:partial}); save(); } else ai.remove();
      t.appendChild(bubble("err", ERR[code] || ERR.upstream_error));
    }
  }finally{ ctl = null; setBusy(false); scrollThread(); }
}

let authMode = "login";
const AUTH = {
  login: {title:"Welcome back", sub:"Log in to pick up your case where you left it.", submit:"Log in", name:false, pw:true, google:true, row:true, legal:false, sw:'New to Iskra? <button type="button" class="auth-link" data-auth="signup">Create a free account</button>'},

  forgot:{title:"Reset your password", sub:"We'll email you a link to set a new one.", submit:"Send reset link", name:false, pw:false, google:false, row:false, legal:false, sw:'<button type="button" class="auth-link" data-auth="login">Back to log in</button>'}

function setAuth(m){
  authMode = AUTH[m] ? m : "login"; const c = AUTH[authMode];
  $("#auth-main").hidden = false; $("#auth-done").hidden = true;
  $("#auth-title").textContent = c.title; $("#auth-sub").textContent = c.sub;
  $("#auth-google").hidden = !c.google; $("#auth-or").hidden = !c.google;
  $("#f-name").hidden = !c.name; $("#f-pw").hidden = !c.pw; $("#auth-row").hidden = !c.row; $("#auth-legal").hidden = !c.legal;
  $("#auth-form").password.autocomplete = authMode === "signup" ? "new-password" : "current-password";
  $("#auth-submit").textContent = c.submit; $("#auth-switch").innerHTML = c.sw; authError("");
  setTimeout(() => { const first = $$("#auth-form input").find(i => !i.closest(".field").hidden); if(first) first.focus(); }, 30);
}
function authError(msg, field){ const e = $("#auth-err"); e.textContent = msg; e.hidden = !msg; $$("#auth-form input").forEach(i => i.removeAttribute("aria-invalid")); if(field) field.setAttribute("aria-invalid","true"); }
function openAuth(m){ setAuth(m); $("#auth").hidden = false; $("#acct-menu").hidden = true; }
function closeAuth(){ $("#auth").hidden = true; $("#auth-form").reset(); }

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600); }
function renderAccount(){
  const on = !!user, nl = $("#nav-login");
  if(on){ nl.textContent = "My dashboard"; nl.removeAttribute("data-auth-open"); nl.onclick = () => setView("app"); $("#acct-initial").textContent = (user.name || user.email || "?").trim()[0].toUpperCase(); $("#acct-name").textContent = user.name; $("#acct-email").textContent = user.email; }

function signIn(u, remember){
  user = u; S.gated = false; scriptStep = 0;
  try{ localStorage.removeItem(SESSION); sessionStorage.removeItem(SESSION); (remember ? localStorage : sessionStorage).setItem(SESSION, JSON.stringify(u)); }catch(e){}
  if(u.name && !S.profile.name) S.profile.name = u.name;
  save(); renderAccount(); renderThread(); renderChips();
}
function signOut(){
  user = null; try{ localStorage.removeItem(SESSION); sessionStorage.removeItem(SESSION); }catch(e){}
  renderAccount(); setView("site"); renderThread(); renderChips(); toast("Logged out");
}
function wireAuth(){
  document.addEventListener("click", e => {
    const o = e.target.closest("[data-auth-open]"); if(o){ openAuth(o.dataset.authOpen); return; }
    const a = e.target.closest("[data-auth]"); if(a && a.closest("#auth")){ setAuth(a.dataset.auth); return; }
    const u = e.target.closest("[data-unlock]"); if(u){ openCheckout(u.dataset.unlock); return; }
    const g = e.target.closest("[data-go]"); if(g){ setView("app"); showModule(g.dataset.go); return; }
    const ml = e.target.closest("[data-module-link]"); if(ml){ e.preventDefault(); showModule(ml.dataset.moduleLink); return; }
    const rf = e.target.closest("#run-free-2"); if(rf){ runFreeAssessment(); return; }
    const m = e.target.closest("[data-menu]"); if(m){ $("#acct-menu").hidden = true; if(m.dataset.menu === "logout") signOut(); else setView("site"); return; }
    if(!e.target.closest("#account")){ $("#acct-menu").hidden = true; $("#acct-btn").setAttribute("aria-expanded","false"); }
  });
  $("#acct-btn").addEventListener("click", e => { e.stopPropagation(); const mm = $("#acct-menu"); mm.hidden = !mm.hidden; $("#acct-btn").setAttribute("aria-expanded", String(!mm.hidden)); });
  $("#auth-x").addEventListener("click", closeAuth); $("#auth").addEventListener("click", e => { if(e.target === $("#auth")) closeAuth(); });
  $("#co-x").addEventListener("click", closeCheckout); $("#checkout").addEventListener("click", e => { if(e.target === $("#checkout")) closeCheckout(); });
  $("#pw-toggle").addEventListener("click", () => { const i = $("#auth-form").password; i.type = i.type === "password" ? "text" : "password"; $("#pw-toggle").textContent = i.type === "password" ? "Show" : "Hide"; });
  $("#auth-form").addEventListener("submit", async e => {
    e.preventDefault();
    const f = $("#auth-form"), c = AUTH[authMode];
    const name = f.name.value.trim(), email = f.email.value.trim(), pw = f.password.value, remember = !!f.remember.checked;
    if(c.name && !name) return authError("Tell us your name.", f.name);
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return authError("That email doesn't look right.", f.email);
    if(c.pw && pw.length < 8) return authError("Your password needs at least 8 characters.", f.password);
    authError(""); const btn = $("#auth-submit"); btn.classList.add("busy"); await new Promise(r => setTimeout(r, 900)); btn.classList.remove("busy");
    if(authMode === "forgot"){ showDone("Check your inbox", "We've sent a reset link to " + email + ". It expires in 30 minutes.", "Back to log in", () => setAuth("login")); return; }
    const display = name || email.split("@")[0].replace(/[._-]+/g," ").replace(/\b\w/g, ch => ch.toUpperCase());
    signIn({name:display, email}, authMode === "login" ? remember : true); f.reset();
    const pu = pendingUnlock; pendingUnlock = null;
    showDone(authMode === "signup" ? "Account created" : "You're in", "Signed in as " + email + ". Your conversation and profile carried over.", pu ? "Continue to unlock" : "Open my dashboard",
      () => { closeAuth(); setView("app"); if(pu) openCheckout(pu); });
  });
}

function demoResetCheck(){
  let q = ""; try{ q = (location.search || "") + (location.hash || ""); }catch(e){}
  if(!/(^|[?&#])(demo|reset)\b/i.test(q)) return;
  clearStored(true); user = null; try{ history.replaceState(null, "", location.pathname); }catch(e){}
}
function clearComposer(){ const b = $("#input"); if(b){ b.value = ""; b.style.height = "auto"; } }
function resetConversation(){
  const keep = {plan:S.plan, module:S.module}; S = Object.assign(blank(), keep); scriptStep = 0; clearStored(false); save(); clearComposer();
  renderThread(); renderChips(); if(user) renderApp(); setTimeout(() => $("#input").focus(), 40);
}
function resetEverything(){
  clearStored(true); user = null; S = blank(); scriptStep = 0; save(); clearComposer();
  renderAccount(); setView("site"); renderThread(); renderChips(); closeChat(); closeAuth(); closeCheckout(); $("#nudge").hidden = true; toast("Demo reset — clean slate");
}
function armConfirm(btn, label, go){
  if(!btn) return; const idle = btn.innerHTML; let armed = false, t = null;
  const stand = () => { armed = false; btn.classList.remove("confirm"); btn.innerHTML = idle; };
  btn.addEventListener("click", e => { e.stopPropagation(); if(armed){ clearTimeout(t); stand(); go(); return; } armed = true; btn.classList.add("confirm"); btn.textContent = label; t = setTimeout(stand, 3000); });
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  demoResetCheck(); S = load();
  renderAccount(); wireAuth(); renderThread(); renderChips();
  $$("[data-open-chat]").forEach(b => b.addEventListener("click", () => openChat(b.dataset.prefill || "")));
  $("#launcher").addEventListener("click", () => openChat(""));
  $("#w-close").addEventListener("click", closeChat);
  armConfirm($("#w-reset"), "Reset?", resetConversation);
  armConfirm($("#foot-reset"), "Reset everything?", resetEverything);
  $("#send").addEventListener("click", send);
  $("#stop").addEventListener("click", () => { if(ctl) ctl.abort(); });
  const box = $("#input");
  box.addEventListener("input", () => { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 120) + "px"; });
  box.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
  $$(".rail-item").forEach(b => b.addEventListener("click", () => showModule(b.dataset.module)));
  document.addEventListener("keydown", e => {
    if(e.key !== "Escape") return;
    if(!$("#auth").hidden) closeAuth(); else if(!$("#checkout").hidden) closeCheckout();
    else if(!$("#acct-menu").hidden) $("#acct-menu").hidden = true; else if(!$("#widget").hidden && !docked) closeChat();
  });
  let dismissed = false; try{ dismissed = sessionStorage.getItem("iskra-nudge") === "1"; }catch(e){}
  if(!dismissed && !S.turns.length && !user) setTimeout(() => { if($("#widget").hidden && $("#app").hidden) $("#nudge").hidden = false; }, 6000);
  $("#nudge-x").addEventListener("click", () => { $("#nudge").hidden = true; try{ sessionStorage.setItem("iskra-nudge","1"); }catch(e){} });
  $("#nudge").addEventListener("click", e => { if(e.target.id !== "nudge-x") openChat(""); });
  if(user) setView("app");
  capabilities();
}
async function capabilities(){
  if(!window.claude || typeof window.claude.use !== "function"){ setMode("script"); return; }
  try{ const s = await window.claude.use("sample"); if(s){ sampleFn = s; setMode("live"); } else setMode("script"); }catch(e){ setMode("script"); }
  try{ const d = await window.claude.use("downloads"); if(d) downloadsFn = d; }catch(e){}
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
