<html lang="en">
<head>
<meta charset="utf-8">

<title>Iskra Services — Build your business in the UK</title>

<!-- Concept prototype for Iskra Services. Kept out of search results so it
     cannot compete with or be mistaken for the live iskra.services site. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Concept prototype: find the right route into the UK, get a free nine-area founder assessment, and prepare your case with an AI advisor and Iskra's team.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap">

<style>
/* ============================================================
   ISKRA SERVICES — site prototype v4
   Pre-login site + post-login founder app, one file.
   One visual world, painted explicitly: deep navy bands, off-white body.
   ============================================================ */
:root{
  --navy:#0E1E3A; --navy-2:#13294D; --navy-3:#1A3563;
  --light:#F4F4F4; --white:#FFFFFF; --black:#121212;
  --grey:#6B6F76; --grey-2:#9A9EA5; --line:#E0E2E6; --line-2:#EEEFF2;
  --line-dark:rgba(255,255,255,.13);
  --gold:#E9B949; --gold-2:#F6D983; --gold-wash:#FBF3DC; --sky:#7FB3FF;
  --ok:#1E8A5A;   --ok-wash:#E3F3EB;
  --warn:#B7791F; --warn-wash:#FBF0DA;
  --bad:#B3261E;  --bad-wash:#FBE7E5;
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --wrap:1200px; --r:6px; --r-lg:14px;
  --shadow:0 1px 2px rgba(18,18,18,.04),0 12px 32px -18px rgba(18,18,18,.22);
  --shadow-lg:0 4px 12px rgba(18,18,18,.06),0 30px 70px -30px rgba(18,18,18,.35);
}
/* Carried over from the artifact host: everything togglable uses `hidden`,
   and the page's own display rules would otherwise out-specify the default. */
[hidden]:not([hidden="until-found"]){display:none!important}
img{max-width:100%}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--light);color:var(--black);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 40px}
section[id]{scroll-margin-top:84px}

/* ---------- type roles ---------- */
.display{font-weight:300;font-stretch:118%;letter-spacing:-.01em;line-height:1.02;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.lede{font-size:18px;line-height:1.5;max-width:52ch;text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--grey);font-size:14px;line-height:1.5}
.tiny{font-size:12px;color:var(--grey-2);line-height:1.45}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 22px;border-radius:var(--r);border:1px solid transparent;font-size:15.5px;font-weight:500;line-height:1;white-space:nowrap;transition:background .18s,color .18s,border-color .18s,transform .18s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn-white{background:var(--white);color:var(--black);border-color:var(--white)}
.btn-white:hover{background:#ECECEC;border-color:#ECECEC}
.btn-black{background:var(--black);color:var(--white);border-color:var(--black)}
.btn-black:hover{background:#2B2B2B;border-color:#2B2B2B}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn-gold:hover{background:var(--gold-2);border-color:var(--gold-2)}
.btn-outline-light{background:transparent;color:var(--white);border-color:rgba(255,255,255,.35)}
.btn-outline-light:hover{border-color:var(--white)}
.btn-line{background:var(--white);border-color:var(--line);color:var(--black)}
.btn-line:hover{border-color:var(--black)}
.btn-sm{padding:9px 14px;font-size:13.5px}
.btn.busy{color:transparent;pointer-events:none;position:relative}
.btn.busy::after{content:"";position:absolute;left:50%;top:50%;margin:-9px 0 0 -9px;width:18px;height:18px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn-line.busy::after,.btn-white.busy::after{border-color:rgba(0,0,0,.2);border-top-color:#121212}
@keyframes spin{to{transform:rotate(360deg)}}
.link{font-weight:500;display:inline-flex;align-items:center;gap:8px;background:none;border:none;padding:0;font-size:inherit}
.link::after{content:"→";transition:transform .18s}
.link:hover::after{transform:translateX(3px)}

/* ---------- pills / lights ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;border-radius:100px;padding:4px 10px;line-height:1.3;white-space:nowrap}
.pill-ok{background:var(--ok-wash);color:var(--ok)} .pill-warn{background:var(--warn-wash);color:var(--warn)} .pill-bad{background:var(--bad-wash);color:var(--bad)}
.pill-grey{background:var(--line-2);color:var(--grey)} .pill-gold{background:var(--gold-wash);color:#7A5410} .pill-navy{background:var(--navy);color:var(--white)}
.light{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.light-ok{background:var(--ok)} .light-warn{background:var(--warn)} .light-bad{background:var(--bad)} .light-grey{background:var(--line)}

/* ============================================================
   DARK BANDS
   ============================================================ */
.dark{background:var(--navy);color:var(--white);position:relative;overflow:hidden}
.blob{position:absolute;pointer-events:none;border-radius:50%;filter:blur(70px);opacity:.85}
.blob-gold{width:640px;height:640px;right:-120px;top:-140px;background:radial-gradient(circle at 60% 40%,var(--gold-2) 0%,var(--gold) 38%,rgba(233,185,73,0) 72%)}
.blob-sky{width:520px;height:520px;right:340px;top:80px;background:radial-gradient(circle,rgba(127,179,255,.55) 0%,rgba(127,179,255,0) 68%);opacity:.7}
.hairlines{position:absolute;inset:0;pointer-events:none}
.hairlines i{position:absolute;left:0;right:0;height:1px;background:var(--line-dark)}

/* ---------- nav ---------- */
.nav-wrap{position:sticky;top:0;z-index:50;background:var(--navy);color:var(--white)}
.nav{display:flex;align-items:center;gap:32px;height:78px;border-bottom:1px solid var(--line-dark)}
.logo{display:flex;flex-direction:column;gap:7px;align-items:flex-start;flex:none}
.logo-name{font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase;line-height:.92;display:block}
.logo-name i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:4px}
.logo-tag{display:inline-flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;font-weight:500;opacity:.78;line-height:1;white-space:nowrap}
.logo-tag svg{width:18px;height:12px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-links{display:flex;gap:28px;margin-left:auto}
.nav-links a{font-size:15.5px;font-weight:500;opacity:.92}
.nav-links a:hover{opacity:1;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.nav-login{background:none;border:none;font-size:15.5px;font-weight:500;opacity:.92;padding:0;color:inherit}
.nav-login:hover{opacity:1;text-decoration:underline;text-underline-offset:6px}
.nav-burger{display:none;background:none;border:1px solid var(--line-dark);border-radius:var(--r);padding:8px 12px;font-size:14px}
.account{position:relative}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--navy);border:none;font-weight:700;font-size:15px;display:grid;place-items:center}
.avatar:hover{background:var(--gold-2)}
.acct-menu{position:absolute;right:0;top:48px;background:var(--white);color:var(--black);border-radius:12px;box-shadow:var(--shadow-lg);min-width:240px;padding:8px;z-index:60}
.acct-who{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;display:flex;flex-direction:column;gap:3px}
.acct-who b{font-size:14.5px}
.acct-who span{font-size:12.5px;color:var(--grey);overflow-wrap:anywhere}
.acct-menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 12px;border-radius:8px;font-size:14.5px}
.acct-menu button:hover{background:var(--light)}

/* ---------- hero ---------- */
.hero{padding:140px 0 120px;position:relative;z-index:1}
.hero h1{font-size:clamp(46px,7vw,100px);max-width:12ch}
.hero .lede{margin-top:26px;opacity:.9;font-size:19px}
.hero-actions{display:flex;gap:12px;margin-top:44px;flex-wrap:wrap}
.hero-note{margin-top:22px;font-size:13px;opacity:.6;max-width:56ch;line-height:1.5}

/* ---------- nine areas band ---------- */
.areas-band{padding:76px 0 72px;border-top:1px solid var(--line-dark);position:relative;z-index:1}
.areas-band .eyebrow{opacity:.75;margin-bottom:22px}
.areas-band p.big{font-size:22px;line-height:1.45;max-width:38ch;text-wrap:pretty}
.nine{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line-dark);border:1px solid var(--line-dark);border-radius:var(--r);overflow:hidden;margin-top:40px}
.nine div{background:var(--navy);padding:16px 20px;display:flex;align-items:baseline;gap:12px}
.nine b{font-size:16px;font-weight:600}
.nine small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;min-width:22px}

/* ---------- marquee ---------- */
.marquee{border-top:1px solid var(--line-dark);border-bottom:1px solid var(--line-dark);padding:26px 0;overflow:hidden;position:relative;z-index:1}
.marquee-track{display:flex;gap:64px;width:max-content;animation:slide 44s linear infinite}
.marquee-track span{font-size:20px;font-weight:500;white-space:nowrap;opacity:.85;font-stretch:108%}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marquee-track{animation:none;flex-wrap:wrap;width:auto;gap:28px 48px}}
.marquee-label{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin-bottom:18px;font-weight:600}

/* ============================================================
   LIGHT SECTIONS
   ============================================================ */
.section{padding:120px 0}
.sec-title{font-size:clamp(34px,4.2vw,58px);max-width:16ch}
.sec-sub{font-size:18px;color:var(--grey);margin-top:18px;max-width:46ch;line-height:1.5}
.rule{height:1px;background:var(--black);opacity:.85;margin:0 0 110px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;flex-wrap:wrap;margin-bottom:56px}

/* how it works — the five-stage ladder (a real sequence, so it is numbered) */
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.rung{background:var(--white);border-radius:var(--r-lg);padding:26px 22px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-height:250px;position:relative}
.rung[data-kind="free"]{border:1px solid var(--line)}
.rung[data-kind="external"]{background:var(--navy);color:var(--white)}
.rung .n{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--grey)}
.rung[data-kind="external"] .n{color:var(--gold)}
.rung h3{font-size:24px;font-weight:300;font-stretch:112%;line-height:1.08}
.rung p{font-size:14px;line-height:1.5;color:var(--grey)}
.rung[data-kind="external"] p{color:rgba(255,255,255,.75)}
.rung .who{margin-top:auto;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--black)}
.rung[data-kind="external"] .who{color:var(--gold)}
.ladder-note{margin-top:22px;font-size:14px;color:var(--grey);max-width:70ch;line-height:1.55}

/* routes */
.routes-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:34px}
.arrows{display:flex;gap:10px}
.arrow{width:38px;height:38px;border-radius:50%;background:var(--black);color:var(--white);border:none;display:grid;place-items:center;font-size:16px}
.arrow:hover{background:#2B2B2B}
.routes{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 24px;margin:0 -4px;scrollbar-width:none}
.routes::-webkit-scrollbar{display:none}
.route{flex:0 0 min(384px,84vw);scroll-snap-align:start;border:1px solid var(--black);border-radius:var(--r-lg);padding:26px 28px 28px;display:flex;flex-direction:column;gap:22px;background:var(--light);min-height:330px}
.route:hover{background:var(--white)}
.chips{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--black);flex-wrap:nowrap;white-space:nowrap}
.chips span{display:inline-flex;align-items:center;gap:6px}
.chips .tag{margin-left:auto;flex:none;background:var(--black);color:var(--white);border-radius:5px;padding:4px 9px;font-size:12.5px;font-weight:500}
.chips .tag.soft{background:transparent;color:var(--grey);border:1px solid var(--line)}
.route h3{font-size:36px;font-weight:300;font-stretch:112%;line-height:1.06;letter-spacing:-.01em;margin-top:auto}
.route p{font-size:16px;color:var(--grey);line-height:1.5}
.route .link{font-size:15.5px}

/* what you get */
.value-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.value{background:var(--white);border-radius:var(--r-lg);padding:26px 26px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:210px}
.value .n{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--grey);display:flex;justify-content:space-between;align-items:center;gap:10px}
.value h3{font-size:21px;font-weight:500;line-height:1.2}
.value p{font-size:14.5px;line-height:1.5;color:var(--grey)}
.value ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.value li{font-size:12px;border:1px solid var(--line);border-radius:100px;padding:4px 10px;color:var(--black)}
.value[data-kind="external"]{background:var(--navy);color:var(--white)}
.value[data-kind="external"] .n,.value[data-kind="external"] p{color:rgba(255,255,255,.75)}
.value[data-kind="external"] .n b{color:var(--gold)}

/* pricing */
.price-note{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#7A5410;background:var(--gold-wash);border-radius:100px;padding:6px 12px;font-weight:500}
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.plan{background:var(--white);border-radius:var(--r-lg);padding:28px 26px 26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;border:1px solid transparent}
.plan[data-flag="flagship"]{border-color:var(--black)}
.plan .stage{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--grey);display:flex;justify-content:space-between;align-items:center}
.plan h3{font-size:24px;font-weight:300;font-stretch:112%;line-height:1.08}
.plan .price{font-size:34px;font-weight:300;font-stretch:112%;line-height:1;letter-spacing:-.01em}
.plan .price small{font-size:14px;color:var(--grey);font-stretch:100%;margin-left:6px}
.plan ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--grey);line-height:1.45}
.plan ul li{padding-left:18px;position:relative}
.plan ul li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:2px;background:var(--black)}
.plan .btn{margin-top:auto}
.external-row{margin-top:16px;background:var(--navy);color:var(--white);border-radius:var(--r-lg);padding:26px 30px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:26px;align-items:center}
.external-row .n{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--gold)}
.external-row h3{font-size:24px;font-weight:300;font-stretch:112%;line-height:1.1;margin-top:4px}
.external-row p{font-size:14.5px;opacity:.8;line-height:1.5;max-width:64ch;margin-top:6px}
.external-row .fee{text-align:right}
.external-row .fee b{display:block;font-size:30px;font-weight:300;font-stretch:112%;line-height:1}
.external-row .fee span{font-size:12.5px;opacity:.7}

/* cta / about / footer */
.cta{padding:120px 0}
.cta h2{font-size:clamp(40px,5.4vw,76px);max-width:14ch}
.cta .lede{margin-top:24px;opacity:.88}
.cta .btn{margin-top:40px}
.about{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:60px;align-items:start;padding:80px 0 100px}
.about p{font-size:18px;color:var(--grey);line-height:1.55;max-width:46ch}
.about-facts{display:grid;grid-template-columns:1fr 1fr;gap:22px 32px}
.about-facts div{display:flex;flex-direction:column;gap:5px}
.about-facts small{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey-2);font-weight:600}
.about-facts span{font-size:16px}
.foot{padding:70px 0 40px;position:relative;z-index:1}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
.foot h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin-bottom:16px;font-weight:600}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px}
.foot ul a,.foot ul button{opacity:.9;background:none;border:none;padding:0;font-size:15px;text-align:left}
.foot ul a:hover,.foot ul button:hover{opacity:1;text-decoration:underline;text-underline-offset:5px}
.foot-tag{font-size:15px;opacity:.8;max-width:30ch;margin-top:16px;line-height:1.5}
.foot-legal{margin-top:56px;padding-top:24px;border-top:1px solid var(--line-dark);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:12.5px;opacity:.6;line-height:1.6}
.proto{display:inline-flex;align-items:center;gap:8px;font-size:12px;border:1px solid rgba(255,255,255,.3);border-radius:100px;padding:4px 11px;opacity:.85}
.proto i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.foot-tools{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.foot-reset{background:none;border:1px solid rgba(255,255,255,.25);border-radius:100px;padding:4px 11px;font-size:12px;opacity:.7;color:inherit;line-height:1.5}
.foot-reset:hover{opacity:1;border-color:rgba(255,255,255,.6)}
.foot-reset.confirm{background:var(--gold);color:var(--navy);border-color:var(--gold);opacity:1;font-weight:600}

/* ============================================================
   APP SHELL (post-login)
   ============================================================ */
#app{min-height:100vh;display:flex;flex-direction:column;background:var(--light)}
.app-top{position:sticky;top:0;z-index:50;background:var(--navy);color:var(--white)}
.app-top-inner{display:flex;align-items:center;gap:26px;height:70px;padding:0 28px}
.plan-badge{margin-left:auto;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--gold);border:1px solid rgba(233,185,73,.5);border-radius:100px;padding:5px 10px;white-space:nowrap;flex:none}

/* milestone map — the journey, horizontal, always visible */
.app-map{background:var(--navy-2);color:var(--white);border-top:1px solid var(--line-dark);border-bottom:1px solid var(--line-dark)}
.map{display:flex;align-items:stretch;padding:0 28px;overflow-x:auto;scrollbar-width:none}
.map::-webkit-scrollbar{display:none}
.ms{flex:1 1 0;min-width:132px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px 14px 14px 0;background:none;border:none;color:inherit;text-align:left;position:relative;font-size:13px;line-height:1.25}
.ms + .ms::before{content:"";position:absolute;left:-22px;top:26px;width:22px;height:1px;background:rgba(255,255,255,.22)}
.ms .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--white);flex:none}
.ms[data-state="done"] .dot{background:var(--ok);border-color:var(--ok)}
.ms[data-state="now"] .dot{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.ms[data-state="external"] .dot{border-color:var(--gold);border-style:dashed}
.ms .lbl{opacity:.75;white-space:nowrap}
.ms[data-state="now"] .lbl{opacity:1;font-weight:600}
.ms[data-state="done"] .lbl{opacity:.9}
.ms .sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;white-space:nowrap}
.ms[data-state="now"] .sub{color:var(--gold);opacity:1}
.ms:hover .lbl{opacity:1}
.ms:disabled{cursor:default}

.app-body{display:grid;grid-template-columns:250px minmax(0,1fr);flex:1;min-height:0}
.rail{background:var(--white);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:70px;height:calc(100vh - 70px);overflow-y:auto}
.rail-label{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--grey-2);padding:10px 12px 8px}
.rail-item{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;text-align:left;padding:10px 12px;border-radius:8px;font-size:14.5px;color:var(--black)}
.rail-item:hover{background:var(--light)}
.rail-item[aria-current="page"]{background:var(--navy);color:var(--white)}
.rail-item .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.rail-item[data-state="done"] .dot{background:var(--ok)}
.rail-item[data-state="now"] .dot{background:var(--gold)}
.rail-item[data-state="locked"]{color:var(--grey)}
.rail-item .lock{margin-left:auto;font-size:11px;color:var(--grey-2)}
.rail-item[aria-current="page"] .lock{color:rgba(255,255,255,.8)}
.pane{padding:34px 40px 60px;min-width:0}
.pane-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.pane-head h1{font-size:clamp(30px,3.4vw,44px);font-weight:300;font-stretch:112%;line-height:1.05;letter-spacing:-.01em}
.pane-head p{color:var(--grey);margin-top:8px;max-width:62ch;font-size:15px;line-height:1.5}
.pane-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--white);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px 26px}
.panel + .panel{margin-top:18px}
.panel h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--grey);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel h3 small{font-weight:500;letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--grey-2)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.grid-2 > *,.grid-3 > *,.stack > *,.strengthen > *{min-width:0}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}

/* dashboard — the current step, big */
.welcome{font-size:clamp(30px,3.4vw,44px);font-weight:300;font-stretch:112%;line-height:1.05}
.now-card{background:var(--navy);color:var(--white);border-radius:var(--r-lg);padding:30px 32px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:26px;align-items:center}
.now-card .n{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--gold)}
.now-card h2{font-size:clamp(24px,2.6vw,34px);font-weight:300;font-stretch:112%;line-height:1.1;margin-top:8px}
.now-card p{font-size:15px;opacity:.82;line-height:1.5;margin-top:10px;max-width:62ch}
.now-card .btn{white-space:nowrap}
.now-card .prog{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:12.5px;opacity:.8}
.now-card .prog .bar{width:160px;height:5px;border-radius:100px;background:rgba(255,255,255,.18);overflow:hidden}
.now-card .prog .bar b{display:block;height:100%;background:var(--gold);border-radius:100px}

/* readiness lights */
.lights{display:flex;flex-direction:column;gap:8px}
.light-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;background:var(--light);font-size:14px}
.light-row b{font-weight:600;min-width:150px}
.light-row span{color:var(--grey);font-size:13.5px;flex:1;min-width:0;overflow-wrap:anywhere}
.light-row .verdict{margin-left:auto;font-weight:600;font-size:13px;flex:none}
.light-row[data-v="strong"] .verdict{color:var(--ok)} .light-row[data-v="moderate"] .verdict{color:var(--warn)} .light-row[data-v="weak"] .verdict{color:var(--bad)}
.lights.compact .light-row{padding:7px 10px}
.lights.compact .light-row span{display:none}
.score-label{font-size:12px;color:#7A5410;background:var(--gold-wash);border-radius:6px;padding:8px 10px;line-height:1.45;margin-top:14px}

/* intake — the nine questions */
.intake-bar{display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--grey);margin-bottom:18px}
.intake-bar .bar{flex:1;max-width:260px;height:6px;background:var(--line-2);border-radius:100px;overflow:hidden}
.intake-bar .bar b{display:block;height:100%;background:var(--navy);border-radius:100px;transition:width .4s}
.iq{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;padding:20px 0;border-bottom:1px solid var(--line-2)}
.iq:last-of-type{border-bottom:none}
.iq .n{font-size:22px;font-weight:300;font-stretch:112%;color:var(--grey-2);line-height:1;padding-top:4px}
.iq label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--grey);margin-bottom:6px}
.iq .q{font-size:16px;font-weight:500;margin-bottom:10px;line-height:1.35}
.iq textarea{width:100%;min-height:78px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.5;resize:vertical;background:var(--white)}
.iq textarea:focus{outline:none;border-color:var(--black)}
.iq textarea:placeholder-shown{background:var(--light)}
.iq small{display:block;margin-top:6px;font-size:12.5px;color:var(--grey-2)}
.iq .ok{font-size:11.5px;color:var(--ok);font-weight:600;margin-left:8px}
.intake-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.demo-note{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#7A5410;background:var(--gold-wash);border-radius:100px;padding:5px 11px}
.demo-note i{width:6px;height:6px;border-radius:50%;background:var(--warn)}

/* assessing… */
.working{display:flex;flex-direction:column;align-items:center;gap:14px;padding:44px 20px;text-align:center}
.working .ring{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--navy);animation:spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.working .ring{animation:none}}
.working b{font-size:17px;font-weight:500}
.working span{font-size:13.5px;color:var(--grey);min-height:20px}

/* assessment result */
.overall{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:20px 22px;border-radius:12px;background:var(--gold-wash);color:#5C3E0B}
.overall b{display:block;font-size:20px;font-weight:600;color:var(--navy)}
.overall p{font-size:14px;margin-top:4px;line-height:1.5}
.overall .pill{background:var(--navy);color:var(--white)}
.weak{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.weak div{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.weak b{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;margin-bottom:6px}
.weak p{font-size:13.5px;color:var(--grey);line-height:1.5}

/* strengthen your case */
.strengthen{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.sv{border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.sv h4{font-size:17px;font-weight:600;line-height:1.25}
.sv p{font-size:14px;color:var(--grey);line-height:1.5}
.sv .btn{align-self:flex-start;margin-top:4px}
.spec{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.spec button{background:var(--white);border:1px solid var(--line);border-radius:100px;padding:7px 12px;font-size:13px}
.spec button:hover{border-color:var(--black)}
.sv.navy{background:var(--navy);color:var(--white);border-color:var(--navy)}
.sv.navy p{color:rgba(255,255,255,.8)}
.sv.navy .btn{background:var(--gold);color:var(--navy);border-color:var(--gold)}

/* business assessment — expandable cards */
.ba{border:1px solid var(--line);border-radius:12px;background:var(--white);margin-bottom:10px}
.ba summary{list-style:none;display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:16px 18px;cursor:pointer}
.ba summary::-webkit-details-marker{display:none}
.ba summary .n{font-size:20px;font-weight:300;font-stretch:112%;color:var(--grey-2);line-height:1}
.ba summary b{font-size:15.5px;font-weight:600;display:block}
.ba summary small{display:block;font-size:13px;color:var(--grey);margin-top:2px}
.ba summary .chev{font-size:18px;color:var(--grey-2);transition:transform .2s}
.ba[open] summary .chev{transform:rotate(90deg)}
.ba .body{padding:4px 18px 20px 66px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 26px}
.ba .body h5{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--grey);margin:0 0 8px}
.ba .body p,.ba .body li{font-size:13.5px;line-height:1.5;color:var(--black)}
.ba .body ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px}
.ba .body .move{grid-column:1/-1;background:var(--light);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.5}
.ba .body .move b{font-weight:600}
.ba .body .ans{grid-column:1/-1;border-left:2px solid var(--gold);padding:6px 12px;font-size:13px;color:var(--grey);line-height:1.5;font-style:italic}
.ivs-test{border-top:2px solid var(--black);padding-top:16px}
.ivs-test h4{font-size:20px;font-weight:300;font-stretch:112%;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ivs-test .from{font-size:12px;color:var(--grey-2);margin-bottom:12px}
.ivs-test ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ivs-test li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.45}
.ivs-test li .light{margin-top:5px}
.ivs-test li span{color:var(--grey)}
.ivs-test li b{font-weight:600;color:var(--black)}

/* score / gaps */
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-size:56px;font-weight:300;font-stretch:112%;line-height:1;letter-spacing:-.02em}
.score span{font-size:16px;color:var(--grey)}
table.areas-t{width:100%;border-collapse:collapse;font-size:14.5px}
table.areas-t td{padding:10px 0;border-bottom:1px solid var(--line-2)}
table.areas-t tr:last-child td{border-bottom:none}
table.areas-t td:last-child{text-align:right;font-weight:600}
.gap{padding:18px 0;border-bottom:1px solid var(--line-2);display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px}
.gap:last-child{border-bottom:none}
.gap .n{font-size:22px;font-weight:300;font-stretch:112%;color:var(--grey-2);line-height:1}
.gap b{font-size:15.5px;font-weight:600;display:block}
.gap p{font-size:14px;color:var(--grey);line-height:1.5;margin-top:4px}
.gap .rec{margin-top:8px;font-size:13.5px;padding:10px 12px;background:var(--light);border-radius:8px;line-height:1.45}
.gap .rec b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);display:block;margin-bottom:3px}
.plan-30{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.plan-30 div{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.plan-30 b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);margin-bottom:8px}
.plan-30 ul{margin:0;padding-left:16px;font-size:13.5px;line-height:1.5}

/* business plan */
.bp-list{display:flex;flex-direction:column;gap:8px}
.bp{border:1px solid var(--line);border-radius:10px;background:var(--white)}
.bp summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;font-size:14.5px;flex-wrap:wrap}
.bp summary::-webkit-details-marker{display:none}
.bp summary .n{font-size:12px;color:var(--grey-2);min-width:22px;font-variant-numeric:tabular-nums}
.bp summary b{font-weight:600}
.bp summary .st{margin-left:auto}
.bp .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.bp textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5;resize:vertical}
.bp textarea:focus{outline:none;border-color:var(--black)}
.bp .based{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--grey)}
.bp .based button{background:none;border:1px solid var(--line);border-radius:100px;padding:3px 9px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.bp .based button:hover{border-color:var(--black)}
.bp .review{font-size:13px;color:#7A5410;background:var(--gold-wash);border-radius:8px;padding:9px 12px;line-height:1.45}
.bp .review b{font-weight:600}
.gen{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;background:var(--navy);color:var(--white);border-radius:var(--r-lg);padding:26px 28px}
.gen h3{font-size:22px;font-weight:300;font-stretch:112%;color:var(--white);letter-spacing:0;text-transform:none;margin:0 0 6px;display:block}
.gen p{font-size:14px;opacity:.82;line-height:1.5;max-width:64ch}

/* evidence */
.ev{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:14.5px}
.ev:last-child{border-bottom:none}
.ev small{display:block;color:var(--grey);font-size:12.5px;margin-top:2px}
.ev .crit{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey-2);font-weight:600}

/* review / endorsement tracker */
.tracker{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tracker li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line-2);font-size:14.5px}
.tracker li:last-child{border-bottom:none}
.tracker .mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--white)}
.tracker li[data-s="done"] .mark{background:var(--ok);border-color:var(--ok)}
.tracker li[data-s="pending"] .mark{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.tracker li[data-s="locked"] .mark{background:var(--light)}
.tracker small{display:block;font-size:12.5px;color:var(--grey);margin-top:2px}
.tracker .who{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--grey-2);text-align:right}
.body-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.body-pick label{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px}
.body-pick label:has(input:checked){border-color:var(--black);background:var(--light)}
.body-pick input{accent-color:var(--black);margin-top:3px}
.body-pick small{display:block;color:var(--grey);font-size:12.5px;margin-top:2px}
.sim{font-size:11.5px;color:var(--grey-2);display:inline-flex;align-items:center;gap:6px;margin-top:10px}
.sim i{width:6px;height:6px;border-radius:50%;background:var(--warn)}

/* lock card */
.lock-card{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:36px 34px;background:var(--white);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:center}
.lock-card .n{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--grey);margin-bottom:8px}
.lock-card h3{font-size:26px;font-weight:300;font-stretch:112%;line-height:1.1;letter-spacing:0;text-transform:none;color:var(--black);margin:0;display:block}
.lock-card p{font-size:14.5px;color:var(--grey);line-height:1.5;margin-top:8px;max-width:56ch}
.lock-card ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.lock-card ul li{font-size:12.5px;border:1px solid var(--line);border-radius:100px;padding:4px 10px}
.lock-card .price{text-align:right}
.lock-card .price b{display:block;font-size:34px;font-weight:300;font-stretch:112%;line-height:1}
.lock-card .price span{display:block;font-size:12px;color:var(--grey-2);margin:4px 0 14px}

/* profile form */
.pf-group{margin-bottom:26px}
.pf-group h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--grey);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.pf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.pf{display:flex;flex-direction:column;gap:5px}
.pf label{font-size:12.5px;font-weight:500;color:var(--grey)}
.pf input,.pf textarea{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14.5px;background:var(--white);width:100%;resize:vertical}
.pf input:focus,.pf textarea:focus{outline:none;border-color:var(--black)}
.pf .src{font-size:11px;color:var(--ok);font-weight:500}

/* ============================================================
   MODALS
   ============================================================ */
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(14,30,58,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;overflow-y:auto}
.modal{position:relative;width:100%;max-width:440px;background:var(--white);color:var(--black);border-radius:18px;padding:36px 36px 26px;box-shadow:var(--shadow-lg);animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.modal-x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:none;background:none;font-size:22px;color:var(--grey);display:grid;place-items:center;line-height:1;z-index:2}
.modal-x:hover{background:var(--light);color:var(--black)}
.auth-mark{width:40px;height:40px;border-radius:50%;background:var(--navy);display:grid;place-items:center;margin-bottom:18px}
.auth-mark i{width:9px;height:9px;border-radius:50%;background:var(--gold)}
.auth-title{font-size:28px;font-weight:300;font-stretch:112%;line-height:1.1;letter-spacing:-.01em}
.auth-sub{font-size:14.5px;color:var(--grey);margin-top:8px;line-height:1.5}
.btn-google{width:100%;justify-content:center;background:var(--white);border-color:var(--line);color:var(--black);margin-top:22px}
.btn-google:hover{border-color:var(--black)}
.btn-google svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--grey-2);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field > span{font-size:12.5px;font-weight:500;color:var(--grey)}
.field input,.field textarea{font-size:15px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--white);width:100%}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--black)}
.field input[aria-invalid="true"]{border-color:var(--bad)}
.pw{position:relative}
.pw input{padding-right:64px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:12.5px;font-weight:500;color:var(--grey);padding:6px 8px;border-radius:6px}
.auth-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-2px 0 16px;font-size:13.5px}
.check{display:inline-flex;align-items:center;gap:8px;color:var(--grey)}
.check input{accent-color:var(--black);width:15px;height:15px;margin:0}
.auth-link{background:none;border:none;padding:0;font-size:inherit;font-weight:500;color:var(--black);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.auth-link:hover{text-decoration-color:var(--black)}
.auth-legal{font-size:12px;color:var(--grey);line-height:1.45;margin:-2px 0 16px}
.auth-err{font-size:13px;color:var(--bad);margin:-6px 0 12px;line-height:1.4}
.auth-submit{width:100%;justify-content:center;position:relative}
.auth-switch{font-size:13.5px;color:var(--grey);text-align:center;margin-top:18px}
.auth-note{font-size:11.5px;color:var(--grey-2);text-align:center;margin-top:16px;line-height:1.45}
.auth-done{text-align:center;padding:6px 0 4px}
